<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Sebaran Pegawai</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
  :root{
    --navy: #16263B;
    --navy-deep: #0E1A2B;
    --gold: #BE9A46;
    --gold-soft: #E9DCB8;
    --paper: #F6F5F1;
    --ink: #1E2530;
    --ink-soft: #5B6472;
    --line: #DEDAD0;
    --panel-w: 340px;
    --sidebar-w: 320px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: 'IBM Plex Sans', sans-serif;
    color: var(--ink);
    background: var(--paper);
  }

  h1, h2, h3, .serif { font-family: 'Lora', serif; }

  #app {
    display: flex;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
  }

  /* ---------- SIDEBAR ---------- */
  #sidebar {
    width: var(--sidebar-w);
    flex-shrink: 0;
    background: var(--navy);
    color: #EDEFF2;
    display: flex;
    flex-direction: column;
    z-index: 20;
  }

  #sidebar-header {
    padding: 22px 20px 18px;
    border-bottom: 1px solid rgba(255,255,255,0.12);
  }

  #sidebar-header .eyebrow {
    font-size: 12px;
    color: var(--gold-soft);
    margin: 0 0 4px;
    letter-spacing: 0.02em;
  }

  #sidebar-header h1 {
    font-size: 20px;
    margin: 0 0 6px;
    line-height: 1.3;
    font-weight: 600;
  }

  #sidebar-header p {
    font-size: 13px;
    color: #B7BFC9;
    margin: 0;
    line-height: 1.5;
  }

  #filter-row {
    padding: 14px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.12);
  }

  #filter-row label {
    display: block;
    font-size: 11.5px;
    color: #9FAAB6;
    margin-bottom: 6px;
  }

  #filter-select, #search-input {
    width: 100%;
    padding: 8px 10px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.18);
    color: #EDEFF2;
    border-radius: 4px;
    font-size: 13.5px;
    font-family: inherit;
  }

  #search-input {
    margin-top: 8px;
  }

  #filter-select:focus, #search-input:focus {
    outline: 2px solid var(--gold);
    outline-offset: 1px;
  }

  #search-input::placeholder { color: #8A94A1; }

  #list-count {
    padding: 12px 20px 6px;
    font-size: 11.5px;
    color: #9FAAB6;
  }

  #employee-list {
    list-style: none;
    margin: 0;
    padding: 0 0 16px;
    overflow-y: auto;
    flex: 1;
  }

  #employee-list li {
    padding: 11px 20px;
    border-left: 3px solid transparent;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  #employee-list li:hover {
    background: rgba(255,255,255,0.05);
  }

  #employee-list li.active {
    background: rgba(190,154,70,0.15);
    border-left-color: var(--gold);
  }

  #employee-list .nm {
    font-size: 14px;
    font-weight: 500;
    color: #F2F3F5;
  }

  #employee-list .meta {
    font-size: 12px;
    color: #A6AFBA;
    margin-top: 2px;
  }

  #legend {
    padding: 14px 20px 18px;
    border-top: 1px solid rgba(255,255,255,0.12);
    font-size: 12px;
  }

  #legend .legend-title {
    color: #9FAAB6;
    font-size: 11px;
    margin-bottom: 8px;
  }

  .legend-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 5px;
    color: #D6DAE0;
  }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* ---------- MAP ---------- */
  #map-wrap {
    position: relative;
    flex: 1;
    min-width: 0;
  }

  #map { height: 100%; width: 100%; background: #E7E4DA; }

  #mobile-toggle {
    display: none;
  }

  /* ---------- DETAIL PANEL ---------- */
  #detail-panel {
    position: absolute;
    top: 0;
    right: 0;
    width: var(--panel-w);
    height: 100%;
    background: #FFFFFF;
    border-left: 1px solid var(--line);
    box-shadow: -6px 0 18px rgba(20,30,45,0.08);
    transform: translateX(100%);
    transition: transform 0.28s ease;
    z-index: 30;
    display: flex;
    flex-direction: column;
  }

  #detail-panel.open { transform: translateX(0); }

  #detail-panel .panel-top {
    padding: 20px 22px 14px;
    border-bottom: 1px solid var(--line);
    position: relative;
  }

  #detail-close {
    position: absolute;
    top: 16px;
    right: 16px;
    background: none;
    border: none;
    font-size: 20px;
    line-height: 1;
    color: var(--ink-soft);
    cursor: pointer;
    padding: 4px;
  }

  #detail-close:hover { color: var(--ink); }

  #detail-panel h2 {
    font-size: 19px;
    margin: 0 26px 4px 0;
    color: var(--navy-deep);
  }

  #detail-panel .role {
    font-size: 13.5px;
    color: var(--gold);
    font-weight: 500;
    margin: 0;
  }

  #detail-body {
    padding: 16px 22px 22px;
    overflow-y: auto;
  }

  .detail-field {
    margin-bottom: 14px;
  }

  .detail-field .k {
    font-size: 11.5px;
    color: var(--ink-soft);
    margin-bottom: 3px;
  }

  .detail-field .v {
    font-size: 14.5px;
    color: var(--ink);
  }

  #boundary-note {
    position: absolute;
    bottom: 14px;
    left: 14px;
    background: rgba(255,255,255,0.92);
    border: 1px solid var(--line);
    padding: 6px 10px;
    font-size: 11.5px;
    color: var(--ink-soft);
    border-radius: 4px;
    display: none;
    z-index: 15;
  }

  .leaflet-popup-content-wrapper {
    font-family: 'IBM Plex Sans', sans-serif;
    border-radius: 4px;
  }

  /* ---------- MOBILE ---------- */
  @media (max-width: 820px) {
    #sidebar {
      position: fixed;
      left: 0; top: 0; bottom: 0;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      z-index: 40;
      width: 84vw;
      max-width: 340px;
    }
    #sidebar.open { transform: translateX(0); }

    #mobile-toggle {
      display: flex;
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 25;
      background: var(--navy);
      color: #fff;
      border: none;
      padding: 9px 13px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 13px;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    #detail-panel {
      width: 100%;
      top: auto;
      bottom: 0;
      height: 62%;
      border-left: none;
      border-top: 1px solid var(--line);
      transform: translateY(100%);
      box-shadow: 0 -6px 18px rgba(20,30,45,0.12);
    }
    #detail-panel.open { transform: translateY(0); }
  }
</style>
</head>
<body>

<div id="app">

  <aside id="sidebar">
    <div id="sidebar-header">
      <p class="eyebrow">Instansi Anda</p>
      <h1>Sebaran Pegawai</h1>
      <p>Peta lokasi penempatan pegawai di seluruh provinsi.</p>
    </div>

    <div id="filter-row">
      <label for="filter-select">Filter jabatan</label>
      <select id="filter-select">
        <option value="all">Semua jabatan</option>
      </select>
      <input id="search-input" type="text" placeholder="Cari nama atau provinsi…">
    </div>

    <div id="list-count">Menampilkan <span id="count-num">0</span> pegawai</div>
    <ul id="employee-list"></ul>

    <div id="legend">
      <div class="legend-title">Keterangan warna</div>
      <div id="legend-rows"></div>
    </div>
  </aside>

  <div id="map-wrap">
    <button id="mobile-toggle">☰ Daftar pegawai</button>
    <div id="map"></div>
    <div id="boundary-note">Batas provinsi belum dimuat — hanya titik pegawai yang ditampilkan.</div>
  </div>

  <div id="detail-panel">
    <div class="panel-top">
      <button id="detail-close" aria-label="Tutup">×</button>
      <h2 id="d-nama">—</h2>
      <p class="role" id="d-jabatan">—</p>
    </div>
    <div id="detail-body">
      <div class="detail-field">
        <div class="k">Satuan kerja</div>
        <div class="v" id="d-satker">—</div>
      </div>
      <div class="detail-field">
        <div class="k">Provinsi</div>
        <div class="v" id="d-provinsi">—</div>
      </div>
      <div class="detail-field" id="d-hp-row">
        <div class="k">Kontak</div>
        <div class="v" id="d-hp">—</div>
      </div>
    </div>
  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* =====================================================================
   DATA PEGAWAI
   -----------------------------------------------------------------
   Ganti isi array di bawah ini dengan data pegawai kamu yang asli.
   Kolomnya sengaja dibuat sama seperti CSV yang kamu pakai di QGIS:
   nama, satker, jabatan, lat, lon — tambahkan "hp" kalau ada nomor
   kontak (boleh dikosongkan "").
   ===================================================================== */
const employeeData = [
  { nama: "Wildani Hapit", satker: "Kejagung",     jabatan: "Komandan",       provinsi: "DKI Jakarta",            hp: "", lat: -6.2408928,  lon: 106.7980474 },
  { nama: "Ayyubie",       satker: "Pandeglang",   jabatan: "Wakil Komandan", provinsi: "Banten",                 hp: "", lat: -6.2991368,  lon: 106.1108989 },
  { nama: "Dikawi",        satker: "Sabu Raijua",  jabatan: "CFO",            provinsi: "Nusa Tenggara Timur",    hp: "", lat: -10.4919356, lon: 121.8479132 },
  { nama: "Chindo",        satker: "Tolitoli",     jabatan: "COO",            provinsi: "Sulawesi Tengah",        hp: "", lat: 1.0430904,   lon: 120.8193663 },
  { nama: "Fadhil",        satker: "Pandeglang",   jabatan: "CMO",            provinsi: "Banten",                 hp: "", lat: -6.2991368,  lon: 106.1108989 },
  { nama: "Rama",          satker: "Pandeglang",   jabatan: "CHLO",           provinsi: "Banten",                 hp: "", lat: -6.2991368,  lon: 106.1108989 },
  { nama: "Geryn",         satker: "Pandeglang",   jabatan: "CLO",            provinsi: "Banten",                 hp: "", lat: -6.2991368,  lon: 106.1108989 },
];

/* Warna per jabatan — tambah baris baru kalau ada jabatan lain */
const jabatanColors = {
  "Komandan": "#BE9A46",
  "Wakil Komandan": "#3E7C8A",
  "CFO": "#7A4B6E",
  "COO": "#4E7A51",
  "CMO": "#B5533C",
  "CHLO": "#3E6B99",
  "CLO": "#8C7A3E",
  "__default": "#8A94A1"
};

/* =====================================================================
   INISIALISASI PETA
   ===================================================================== */
const map = L.map('map', { zoomControl: false }).setView([-2.3, 118], 5);
L.control.zoom({ position: 'bottomright' }).addTo(map);

L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
  maxZoom: 19
}).addTo(map);

/* Coba muat batas provinsi kalau file-nya ada di data/provinsi.geojson.
   Kalau belum ada, peta tetap jalan cuma tanpa garis batas. */
let boundaryLayer = null;
fetch('data/provinsi.geojson')
  .then(res => { if (!res.ok) throw new Error('not found'); return res.json(); })
  .then(geojson => {
    boundaryLayer = L.geoJSON(geojson, {
      style: { color: '#B7BFC9', weight: 1, fillColor: '#D8D4C8', fillOpacity: 0.25 },
      interactive: false
    }).addTo(map);
    boundaryLayer.bringToBack();
  })
  .catch(() => {
    document.getElementById('boundary-note').style.display = 'block';
  });

/* =====================================================================
   MARKER & LIST
   ===================================================================== */
const markers = {};
let activeIdx = null;

function colorFor(jabatan) {
  return jabatanColors[jabatan] || jabatanColors.__default;
}

function makeMarker(emp, idx) {
  const marker = L.circleMarker([emp.lat, emp.lon], {
    radius: 7,
    color: '#fff',
    weight: 2,
    fillColor: colorFor(emp.jabatan),
    fillOpacity: 0.95
  });
  marker.on('click', () => selectEmployee(idx));
  marker.addTo(map);
  return marker;
}

employeeData.forEach((emp, idx) => { markers[idx] = makeMarker(emp, idx); });

function renderList(filterJabatan, searchTerm) {
  const listEl = document.getElementById('employee-list');
  listEl.innerHTML = '';
  let shown = 0;

  employeeData.forEach((emp, idx) => {
    const matchJabatan = filterJabatan === 'all' || emp.jabatan === filterJabatan;
    const term = (searchTerm || '').toLowerCase();
    const matchSearch = !term || emp.nama.toLowerCase().includes(term) || emp.provinsi.toLowerCase().includes(term);
    const visible = matchJabatan && matchSearch;

    if (markers[idx]) {
      if (visible && !map.hasLayer(markers[idx])) markers[idx].addTo(map);
      if (!visible && map.hasLayer(markers[idx])) map.removeLayer(markers[idx]);
    }

    if (!visible) return;
    shown++;

    const li = document.createElement('li');
    li.className = idx === activeIdx ? 'active' : '';
    li.innerHTML = `<div class="nm">${emp.nama}</div><div class="meta">${emp.jabatan} · ${emp.provinsi}</div>`;
    li.addEventListener('click', () => selectEmployee(idx, true));
    listEl.appendChild(li);
  });

  document.getElementById('count-num').textContent = shown;
}

function selectEmployee(idx, fromList) {
  activeIdx = idx;
  const emp = employeeData[idx];

  document.getElementById('d-nama').textContent = emp.nama;
  document.getElementById('d-jabatan').textContent = emp.jabatan;
  document.getElementById('d-satker').textContent = emp.satker;
  document.getElementById('d-provinsi').textContent = emp.provinsi;

  const hpRow = document.getElementById('d-hp-row');
  if (emp.hp) {
    hpRow.style.display = 'block';
    document.getElementById('d-hp').textContent = emp.hp;
  } else {
    hpRow.style.display = 'none';
  }

  document.getElementById('detail-panel').classList.add('open');

  if (fromList) map.flyTo([emp.lat, emp.lon], Math.max(map.getZoom(), 7), { duration: 0.6 });

  renderList(document.getElementById('filter-select').value, document.getElementById('search-input').value);

  if (window.innerWidth <= 820) document.getElementById('sidebar').classList.remove('open');
}

document.getElementById('detail-close').addEventListener('click', () => {
  document.getElementById('detail-panel').classList.remove('open');
  activeIdx = null;
  renderList(document.getElementById('filter-select').value, document.getElementById('search-input').value);
});

/* =====================================================================
   FILTER, SEARCH, LEGEND
   ===================================================================== */
const filterSelect = document.getElementById('filter-select');
const uniqueJabatan = [...new Set(employeeData.map(e => e.jabatan))];
uniqueJabatan.forEach(j => {
  const opt = document.createElement('option');
  opt.value = j; opt.textContent = j;
  filterSelect.appendChild(opt);
});

filterSelect.addEventListener('change', () => renderList(filterSelect.value, document.getElementById('search-input').value));
document.getElementById('search-input').addEventListener('input', (e) => renderList(filterSelect.value, e.target.value));

const legendRows = document.getElementById('legend-rows');
uniqueJabatan.forEach(j => {
  const row = document.createElement('div');
  row.className = 'legend-row';
  row.innerHTML = `<span class="legend-dot" style="background:${colorFor(j)}"></span><span>${j}</span>`;
  legendRows.appendChild(row);
});

/* =====================================================================
   MOBILE SIDEBAR TOGGLE
   ===================================================================== */
document.getElementById('mobile-toggle').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('open');
});

/* Render awal */
renderList('all', '');
</script>

</body>
</html>
